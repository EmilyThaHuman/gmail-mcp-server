# Cloudflare Workers configuration for Gmail MCP Server

name = "gmail-mcp-server"
main = "src/worker.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Worker settings
# Wrangler will handle TypeScript compilation automatically

# Environment variables
[vars]
MCP_SERVER_NAME = "gmail-mcp-server"
MCP_SERVER_VERSION = "1.0.0"
NODE_ENV = "production"
PORT = "3002"

# Secrets (use: wrangler secret put <SECRET_NAME>)
# GOOGLE_CLIENT_ID
# GOOGLE_CLIENT_SECRET
# GOOGLE_REDIRECT_URI
# FRONTEND_URL
# BACKEND_API_URL (optional - for token fallback from profile.settings.oauth_tokens)

# KV Namespaces for session storage
[[kv_namespaces]]
binding = "SESSIONS"
id = "ced6ef1b0a744a49bde82278141ee215"

# Durable Objects for stateful session management (optional, for advanced use)
# [[durable_objects.bindings]]
# name = "GMAIL_SESSIONS"
# class_name = "GmailSessionManager"

# Routes (optional - uncomment and configure if using custom domain)
# routes = [
#   { pattern = "gmail-mcp.zerotwo.app/*", zone_name = "zerotwo.app" }
# ]

# Development settings
[env.development]
vars = { NODE_ENV = "development" }

# Production settings
[env.production]
vars = { NODE_ENV = "production" }

